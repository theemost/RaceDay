
name: .NET

on:
  push:
    branches: [ "main", "raceday_mvc" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay/RaceDay.slnx

      - name: Build solution
        run: dotnet build RaceDay/RaceDay.slnx --no-restore --configuration Release
